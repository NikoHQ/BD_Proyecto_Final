<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 284" role="img" aria-labelledby="title">
  <title id="title">Centro deportivo con cancha de pádel y recepción</title>
  <style>
    .pelota { animation: rebote 1.35s ease-in-out 3; }
    .bandera { transform-origin: 396px 68px; animation: viento 1.8s ease-in-out 2; }
    @keyframes rebote {
      0%, 100% { transform: translate(0, 0); }
      42% { transform: translate(29px, -21px); }
      77% { transform: translate(48px, 2px); }
    }
    @keyframes viento {
      0%, 100% { transform: skewY(0); }
      50% { transform: skewY(9deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pelota, .bandera { animation: none; }
    }
  </style>

  <circle cx="263" cy="133" r="108" fill="#edf7ef"/>
  <path d="M34 246h452" fill="none" stroke="#bdd8c7" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#205d4b" stroke-width="2" stroke-linejoin="round">
    <!-- Farolas y árboles detrás de las instalaciones. -->
    <path d="M100 157V56m-18 0h37m217 97V49m-19 0h38" fill="none"/>
    <rect x="78" y="46" width="44" height="13" rx="3" fill="#fff"/>
    <rect x="314" y="39" width="44" height="13" rx="3" fill="#fff"/>
    <path d="M100 46v13m236-20v13" fill="none"/>
    <path d="M64 227v-34m393 35v-41" fill="none"/>
    <path d="M43 193c0-10 7-23 21-23s21 13 21 23c0 9-9 15-21 15s-21-6-21-15Z" fill="#b9dec7"/>
    <path d="M439 186c0-13 7-25 18-25s18 12 18 25c0 10-7 15-18 15s-18-5-18-15Z" fill="#b9dec7"/>

    <!-- Recepción. -->
    <path d="M358 152h72v76h-72z" fill="#fff"/>
    <path d="m352 154 12-20h59l15 20Z" fill="#087459"/>
    <path d="M384 228v-36h22v36" fill="#d8eee2"/>
    <path d="M367 169h14v14h-14zm41 0h12v14h-12z" fill="#d8eee2"/>
    <path d="M396 133V66" fill="none"/>
    <path class="bandera" d="M397 68h33l-8 8 8 8h-33z" fill="#e7b853"/>

    <!-- Cancha y cerramiento. -->
    <path d="m71 231 48-73h233l-30 73Z" fill="#087459"/>
    <path d="M71 231h251v10H71z" fill="#155543"/>
    <path d="m322 231 30-73v10l-30 73Z" fill="#155543"/>
    <path d="M119 158v-49h233v49" fill="#dbefe5"/>
    <path d="M119 158 71 231v-68l48-54Z" fill="#cce8db"/>
    <path d="M352 158 322 231v-68l30-54Z" fill="#cce8db"/>
    <path d="M172 109v49m64-49v49m59-49v49M94 137v59m243-60v57" fill="none"/>
    <path d="m92 220 34-53h212l-22 53Zm21-27h215m-98-26-26 53" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="m111 194 216 1v-14l-216-1Z" fill="#deefe6" stroke="#123e37"/>
    <path d="M112 185h215m-216 5h216m-197-10v14m18-14v14m18-14v14m18-14v14m18-14v14m18-14v14m18-14v14m18-14v14m18-14v14m18-14v14m18-14v14" fill="none" stroke="#648b7f" stroke-width="1"/>
    <path d="M111 179v17m216-16v17M71 163v68m251-68v68" fill="none"/>
    <circle class="pelota" cx="178" cy="204" r="5" fill="#f4cf68" stroke="#123e37"/>
  </g>
</svg>
