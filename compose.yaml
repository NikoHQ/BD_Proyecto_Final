name: sgcd

services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    container_name: sgcd-oracle
    shm_size: 1g
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Define ORACLE_PASSWORD en .env}
      APP_USER: SGCD
      APP_USER_PASSWORD: ${SGCD_DB_PASSWORD:?Define SGCD_DB_PASSWORD en .env}
    ports:
      - "1521:1521"
    volumes:
      - sgcd-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    image: donvito/php-oci8:8.4
    platform: linux/amd64
    container_name: sgcd-app
    working_dir: /var/www/html
    command: ["php", "-d", "opcache.enable_cli=0", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    environment:
      SGCD_DB_HOST: oracle
      SGCD_DB_PORT: "1521"
      SGCD_DB_SERVICE: FREEPDB1
      SGCD_DB_USER: SGCD19
      SGCD_DB_PASSWORD: ${SGCD_DB_PASSWORD:?Define SGCD_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./web:/var/www/html
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  sgcd-oracle-data:
